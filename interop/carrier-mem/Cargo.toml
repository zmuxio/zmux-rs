[package]
name = "zmux-carrier-mem"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Heap per idle connection of zmux's carriers (TCP, TLS 1.3, QUIC) and of zmux over them"

# Standalone: not a member of the zmux workspace, so the QUIC dependency
# stays out of the main crate's dependency graph:
#   cargo run --release --manifest-path interop/carrier-mem/Cargo.toml
[workspace]

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zmux = { path = "../.." }

[profile.release]
debug = 1
