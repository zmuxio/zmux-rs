[package]
name = "zmux-interop-peer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A scripted zmux peer for cross-implementation interoperability tests over TCP and QUIC"

# Standalone: not a member of the zmux workspace.
#   cargo build --release --manifest-path interop/peer/Cargo.toml
[workspace]

[dependencies]
bytes = "1"
tokio = { version = "1.54", features = ["full"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zmux = { path = "../.." }
zmux-quinn = { path = "../../adapter/quinn" }
zmux-rustls = { path = "../../adapter/rustls" }
zmux-seal = { path = "../../seal" }
zmux-websocket = { path = "../../adapter/websocket" }
x25519-dalek = { version = "3", features = ["static_secrets"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
