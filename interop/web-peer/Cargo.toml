[package]
name = "zmux-web-peer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Scripted zmux WebSocket and HTTP streaming peers for cross-implementation interoperability tests"

# A member of the zmux workspace (never published):
#   cargo build --release --locked -p zmux-web-peer

[dependencies]
http = "1"
tokio = { version = "1.54", features = ["full"] }
zmux = { path = "../.." }
zmux-http = { path = "../../adapter/http", features = ["websocket"] }
zmux-rustls = { path = "../../adapter/rustls" }
hyper = { version = "1.12", features = ["client", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zmux-websocket = { path = "../../adapter/websocket" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "zmux-ws-peer"
path = "src/bin/ws.rs"

[[bin]]
name = "zmux-http-peer"
path = "src/bin/http.rs"

[lints]
workspace = true
