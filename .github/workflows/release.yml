name: Release

# Publishes every crate of the workspace on a tag vX.Y.Z: all crates share
# one version (major 1), the tag names it, crates are published in
# dependency order (the core first), each one dry-run before it is
# published, and a crate whose version is already on crates.io is skipped,
# so that a failed run can be repeated from the same tag.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-rust-${{ runner.os }}-

      - name: Validate crates.io token
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret." >&2
            exit 1
          fi

      - name: Validate the tag and the crate versions; order the crates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"], text=True))
          members = set(meta["workspace_members"])
          pkgs = {p["name"]: p for p in meta["packages"] if p["id"] in members}
          # Publishable crates (`publish = false` is an empty list).
          pkgs = {n: p for n, p in pkgs.items() if p.get("publish") is None or p["publish"]}
          if "zmux" not in pkgs:
              sys.exit("the workspace must contain the zmux crate")
          version = pkgs["zmux"]["version"]
          if not re.fullmatch(r"1\.[0-9]+\.[0-9]+", version):
              sys.exit(f"zmux version {version!r} is not a plain 1.Y.Z release")
          for n, p in pkgs.items():
              if p["version"] != version:
                  sys.exit(f"{n} {p['version']} must match zmux {version} (versions in lockstep)")
              for d in p["dependencies"]:
                  if d["name"] in pkgs and d["kind"] is None:
                      allowed = {version, f"^{version}", f"={version}"}
                      if d["req"] not in allowed:
                          sys.exit(f"{n} depends on {d['name']} {d['req']!r}, expected {version}")
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match the crate version v{version}")

          # Dependency order among the workspace crates (normal and build
          # dependencies; dev-dependencies are stripped when packaged).
          deps = {n: {d["name"] for d in p["dependencies"]
                      if d["name"] in pkgs and d["kind"] != "dev" and d["name"] != n}
                  for n, p in pkgs.items()}
          order = []
          while deps:
              ready = sorted(n for n, ds in deps.items() if ds <= set(order))
              if not ready:
                  sys.exit(f"dependency cycle among {sorted(deps)}")
              order += ready
              for n in ready:
                  del deps[n]
          print("publish order:", " ".join(order))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ZMUX_VERSION={version}\n")
              env.write(f"ZMUX_CRATES={' '.join(order)}\n")
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Build docs
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Dry-run every crate to publish, then publish and wait for each in order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # 0: published, 1: not published, 2: the registry could not tell.
          published() {
            python3 - "$1" "$2" <<'PY'
          import sys, urllib.error, urllib.request
          crate, version = sys.argv[1], sys.argv[2]
          req = urllib.request.Request(
              f"https://crates.io/api/v1/crates/{crate}/{version}",
              headers={"User-Agent": "zmux-rs-release-workflow"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except urllib.error.HTTPError as e:
              sys.exit(1 if e.code == 404 else 2)
          except Exception:
              sys.exit(2)
          PY
          }

          check() {
            local status
            published "$1" "${ZMUX_VERSION}" && return 0
            status=$?
            if [[ "${status}" -eq 2 ]]; then
              echo "could not query crates.io for $1 ${ZMUX_VERSION}" >&2
              exit 2
            fi
            return 1
          }

          todo=()
          for crate in ${ZMUX_CRATES}; do
            if check "${crate}"; then
              echo "${crate} ${ZMUX_VERSION} is already published; skipped."
            else
              todo+=("${crate}")
            fi
          done
          if [[ "${#todo[@]}" -eq 0 ]]; then
            echo "Every crate is published."
            exit 0
          fi
          # All of them at once, before anything is published: the
          # workspace's own crates resolve locally.
          cargo publish --locked --dry-run $(printf -- '-p %s ' "${todo[@]}")
          for crate in "${todo[@]}"; do
            echo "::group::${crate} ${ZMUX_VERSION}"
            cargo publish --locked -p "${crate}"
            # Its dependents resolve it from the registry: wait until it
            # is visible there.
            for attempt in $(seq 1 30); do
              if check "${crate}"; then
                break
              fi
              if [[ "${attempt}" -eq 30 ]]; then
                echo "${crate} ${ZMUX_VERSION} did not appear on crates.io in time." >&2
                exit 1
              fi
              sleep 20
            done
            echo "::endgroup::"
          done
