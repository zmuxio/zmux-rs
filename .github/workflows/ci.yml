name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace, all features
            args: --workspace --all-targets --all-features
          - name: core without drivers
            args: -p zmux --no-default-features
          - name: core, std driver only
            args: -p zmux --no-default-features --features blocking
          - name: QUIC adapter without a crypto provider
            args: -p zmux-quinn --no-default-features
          - name: HTTP/3 adapter without a crypto provider
            args: -p zmux-h3 --no-default-features
          - name: WebTransport adapter with aws-lc-rs
            args: -p zmux-webtransport --no-default-features --features aws-lc-rs
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: doc-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: doc-${{ runner.os }}-
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - name: Core, TLS and QUIC adapters
        run: cargo test --locked --all-features
      - name: Std driver only
        run: cargo test --locked -p zmux --no-default-features --features blocking --lib
      - name: Other adapters
        run: cargo test --locked -p zmux-websocket -p zmux-http -p zmux-h3 -p zmux-webtransport

  release-checks:
    name: Allocation, footprint and write calls (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-checks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-checks-${{ runner.os }}-
      - run: cargo test --locked --release --all-features --test zero_alloc --test footprint --test input_pending
      - name: Build benchmarks
        run: cargo bench --locked --workspace --no-run

  msrv:
    name: Minimum Rust version (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-
      - name: Check every crate and target
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Library tests
        run: cargo test --locked --lib --all-features

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
