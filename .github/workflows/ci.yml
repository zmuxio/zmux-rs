name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace, all features
            args: --workspace --all-targets --all-features
          - name: core without drivers
            args: -p zmux --no-default-features
          - name: core, std driver only
            args: -p zmux --no-default-features --features blocking
          - name: QUIC adapter without a crypto provider
            args: -p zmux-quinn --no-default-features
          - name: HTTP/3 adapter without a crypto provider
            args: -p zmux-h3 --no-default-features
          - name: WebTransport adapter with rustls-aws-lc-rs
            args: -p zmux-webtransport --no-default-features --features rustls-aws-lc-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: doc-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: doc-${{ runner.os }}-
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Default features
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: No default features (links to gated items must be cfg-aware)
        run: |
          cargo doc --locked -p zmux --no-default-features --no-deps
          cargo doc --locked -p zmux --no-default-features --features blocking --no-deps
          cargo doc --locked -p zmux-quinn -p zmux-h3 -p zmux-websocket -p zmux-http --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - name: Core, TLS and QUIC adapters
        run: cargo test --locked --all-features
      - name: Std driver only
        run: cargo test --locked -p zmux --no-default-features --features blocking --lib
      - name: Other adapters
        run: cargo test --locked -p zmux-websocket -p zmux-http -p zmux-h3 -p zmux-webtransport

  release-checks:
    name: Allocation, footprint and write calls (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-checks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-checks-${{ runner.os }}-
      - run: cargo test --locked --release --all-features --test zero_alloc --test footprint --test input_pending
      - name: Build benchmarks
        run: cargo bench --locked --workspace --no-run

  cross:
    name: 32-bit check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            # ring and aws-lc build C and assembly for the target.
            packages: gcc-multilib
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          - target: i686-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the C toolchain for the target
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cross-${{ matrix.target }}-
      # Nothing is run: a 32-bit usize, 4-byte alignment of 64-bit atomics
      # and narrowed casts fail to compile (tests, benches and examples
      # included), not at run time.
      - name: Check every crate and target
        run: cargo check --locked --workspace --all-features --all-targets --target ${{ matrix.target }}

  msrv:
    name: Minimum Rust version (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-
      - name: Check every crate and target
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Library tests
        run: cargo test --locked --lib --all-features

  audit:
    name: Security advisories and licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny --locked check

  fuzz-build:
    name: Fuzz targets (build and lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-build-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-build-${{ runner.os }}-
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings
