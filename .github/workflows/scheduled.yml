name: Scheduled checks

# Long or external-dependency checks, kept out of the default gate: model
# checking of the drivers' synchronization units, interoperability with an
# independent QMux implementation.
on:
  workflow_dispatch:
    inputs:
      loom:
        description: Model-check the synchronization units (loom)
        type: boolean
        default: true
      interop:
        description: Interoperability with the qmux crate
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  loom:
    name: Loom
    if: github.event_name == 'schedule' || inputs.loom
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preemptions: [2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Loom (preemption bound ${{ matrix.preemptions }})
        run: cargo test --locked -p zmux --lib --release loom
        env:
          LOOM_MAX_PREEMPTIONS: ${{ matrix.preemptions }}
          RUSTFLAGS: --cfg loom
          CARGO_TARGET_DIR: target/loom

  interop:
    name: Interop (qmux crate)
    if: github.event_name == 'schedule' || inputs.interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --manifest-path interop/qmux/Cargo.toml

