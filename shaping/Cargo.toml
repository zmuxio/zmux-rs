[package]
name = "zmux-shaping"
version = "1.2.4"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A zmux Shaper driven by state machines read from a versioned definition"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux"]
categories = ["network-programming"]

[features]
# `MachinePoolPolicy` as a `zmux::helpers::PoolPolicy` (needs the tokio driver).
tokio = ["zmux/tokio"]

[dependencies]
rand_chacha = { version = "0.9", features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zmux = { version = "1.2.4", path = "..", default-features = false }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.47", features = ["full"] }
zmux = { version = "1.2.4", path = "..", features = ["tokio"] }
