[package]
name = "zmux-shaping"
version = "1.4.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "State machine and bundle support for zmux"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux"]
categories = ["network-programming"]

[features]
# Compile the session controller target from a pool profile.
tokio = ["zmux/tokio"]

[dependencies]
rand_chacha = "0.10"
getrandom = "0.4"
zmux = { version = "1.4.0", path = "..", default-features = false }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
zmux = { version = "1.4.0", path = "..", features = ["tokio"] }

[lints]
workspace = true
