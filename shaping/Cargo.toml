[package]
name = "zmux-shaping"
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Shaping configuration for zmux: state machines, handshake plans and pool policies"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux"]
categories = ["network-programming"]

[features]
# `MachinePoolPolicy` as a `zmux::helpers::PoolPolicy` (needs the tokio driver).
tokio = ["zmux/tokio"]

[dependencies]
rand_chacha = "0.10"
getrandom = "0.4"
zmux = { version = "1.3.0", path = "..", default-features = false }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
zmux = { version = "1.3.0", path = "..", features = ["tokio"] }
