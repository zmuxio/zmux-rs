# cargo-deny policy: advisories, sources and licences of the workspace lock file.
[graph]
all-features = true

[advisories]
version = 2
# Build-time only (a proc-macro of libcrux's verification annotations); the
# advisory is informational and has no fixed release. Remove when libcrux
# drops the dependency.
ignore = [{ id = "RUSTSEC-2026-0173", reason = "unmaintained proc-macro via libcrux-ml-kem; no safe upgrade" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
