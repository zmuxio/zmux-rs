[package]
name = "zmux-webtransport"
version = "1.2.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WebTransport sessions as zmux carriers: pipes on bidirectional streams, lanes on unidirectional ones"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "webtransport", "http3", "quic", "multipath"]
categories = ["network-programming"]

[features]
# The crypto provider of the WebTransport stack: ring (default) or aws-lc-rs.
default = ["ring"]
ring = ["web-transport-quinn/ring", "zmux-quinn/rustls-ring"]
aws-lc-rs = ["web-transport-quinn/aws-lc-rs", "zmux-quinn/rustls-aws-lc-rs"]

[dependencies]
bytes = "1"
url = "2"
web-transport-quinn = { version = "0.13.6", default-features = false }
tokio = { version = "1.54", default-features = false, features = ["rt", "sync", "time"] }
zmux = { version = "1.2.6", path = "../.." }
zmux-quinn = { version = "1.2.6", path = "../quinn", default-features = false }

[dev-dependencies]
bytes = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54", features = ["full"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
