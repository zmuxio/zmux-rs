[package]
name = "zmux-webtransport"
version = "1.4.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WebTransport sessions as zmux carriers: pipes on bidirectional streams, lanes on unidirectional ones"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "webtransport", "http3", "quic", "multipath"]
categories = ["network-programming"]

[features]
# The rustls provider for zmux-quinn's endpoint configuration.
default = ["rustls-ring"]
rustls-ring = ["zmux-quinn/rustls-ring"]
rustls-aws-lc-rs = ["zmux-quinn/rustls-aws-lc-rs"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
qpack = { version = "0.1", default-features = false }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio"] }
url = "2"
tokio = { version = "1.54", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zmux = { version = "1.4.0", path = "../.." }
zmux-quinn = { version = "1.4.0", path = "../quinn", default-features = false }

[dev-dependencies]
zmux = { path = "../..", features = ["test-hooks"] }
bytes = "1"
zmux-testcert = { path = "../../testcert" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54", features = ["full"] }

[lints]
workspace = true

