[package]
name = "zmux-http"
version = "1.3.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "HTTP/1.1 and HTTP/2 exchanges as zmux pipes over hyper: request and response bodies paired"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "http", "hyper", "http2", "multipath"]
categories = ["network-programming"]

[dependencies]
base64 = "0.23"
bytes = "1"
http = "1"
http-body = "1"
hyper = { version = "1.12", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-auto"] }
tokio = { version = "1.54", default-features = false, features = ["net", "rt", "io-util", "time", "sync", "macros"] }
zmux = { version = "1.3.6", path = "../.." }
zmux-rustls = { version = "1.3.6", path = "../rustls" }
zmux-websocket = { version = "1.3.6", path = "../websocket", optional = true, features = ["hyper"] }

[features]
# The unified Endpoint also serves WebSocket upgrades.
websocket = ["dep:zmux-websocket"]

[dev-dependencies]
sha2 = "0.11"
zmux-testcert = { path = "../../testcert" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zmux = { version = "1.3.6", path = "../..", features = ["test-hooks"] }
zmux-rustls = { path = "../rustls" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true

[[bench]]
name = "bulk"
harness = false
