[package]
name = "zmux-http"
version = "1.2.4"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "HTTP/1.1 and HTTP/2 exchanges as zmux pipes over hyper: request and response bodies paired"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "http", "hyper", "http2", "multipath"]
categories = ["network-programming"]

[dependencies]
base64 = "0.23"
bytes = "1"
getrandom = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
hyper = { version = "1.6", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.10", default-features = false, features = ["tokio", "server-auto"] }
sha2 = "0.11"
tokio = { version = "1.47", default-features = false, features = ["net", "rt", "io-util", "time", "sync", "macros"] }
zmux = { version = "1.2.4", path = "../.." }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zmux = { version = "1.2.4", path = "../..", features = ["test-hooks"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
