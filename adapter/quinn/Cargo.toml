[package]
name = "zmux-quinn"
version = "1.2.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "QUIC connections as zmux carriers: pipes on streams, lanes on further streams, over quinn"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "quic", "quinn", "multipath"]
categories = ["network-programming"]

[features]
# `client_config` and `server_config` from rustls configurations, with
# quinn's ring provider (quinn's default) or its aws-lc-rs one. Without
# either, no crypto provider is chosen here.
default = ["rustls-ring"]
rustls-ring = ["quinn/rustls-ring"]
rustls-aws-lc-rs = ["quinn/rustls-aws-lc-rs"]

[dependencies]
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time"] }
zmux = { version = "1.2.1", path = "../.." }

[dev-dependencies]
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
bytes = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.47", features = ["full"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[[bench]]
name = "quicnet"
harness = false
