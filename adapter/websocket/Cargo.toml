[package]
name = "zmux-websocket"
version = "1.2.5"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WebSocket pipe carriers for zmux over tokio-tungstenite: one message per record"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "websocket", "qmux", "multipath"]
categories = ["network-programming"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54", default-features = false, features = ["net", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
httparse = "1"
# WebSocket upgrades inside a hyper server (feature `hyper`).
hyper = { version = "1.12", optional = true, default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", optional = true, default-features = false, features = ["tokio"] }
zmux = { version = "1.2.5", path = "../.." }
# serve_tls: the admission metadata of a TLS connection.
zmux-rustls = { version = "1.2.5", path = "../rustls" }

[features]
# accept_request: upgrades of requests a hyper server received.
hyper = ["dep:hyper", "dep:hyper-util"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["full"] }
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[[bench]]
name = "bulk"
harness = false
