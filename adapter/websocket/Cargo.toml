[package]
name = "zmux-websocket"
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WebSocket pipe carriers for zmux over tokio-tungstenite: one message per record"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "websocket", "qmux", "multipath"]
categories = ["network-programming"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54", default-features = false, features = ["net", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
httparse = "1"
# WebSocket upgrades inside a hyper server (feature `hyper`).
hyper = { version = "1.12", optional = true, default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", optional = true, default-features = false, features = ["tokio"] }
# wss:// in dial and connect (feature `wss`): the Mozilla roots.
webpki-roots = { version = "1", optional = true }
zmux = { version = "1.3.0", path = "../.." }
# serve_tls: the admission metadata of a TLS connection.

[features]
# accept_request: upgrades of requests a hyper server received.
hyper = ["dep:hyper", "dep:hyper-util"]
# dial and connect also take wss:// URLs: TLS by rustls with the ring provider and the
# Mozilla roots of webpki-roots (tls_connector for other roots). Off by default, as the
# application's own TLS configuration goes to dial_tls without it.
wss = ["dep:webpki-roots", "tokio-rustls/ring"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["full"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
zmux-seal = { path = "../../seal" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[[bench]]
name = "bulk"
harness = false
