[package]
name = "zmux-websocket"
version = "1.2.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WebSocket pipe carriers for zmux over tokio-tungstenite: one message per record"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "websocket", "qmux", "multipath"]
categories = ["network-programming"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.47", default-features = false, features = ["net", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
zmux = { version = "1.2.2", path = "../.." }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.47", features = ["full"] }
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
