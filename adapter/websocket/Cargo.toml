[package]
name = "zmux-websocket"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "WebSocket pipe carriers for zmux over tokio-tungstenite: one message per record"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "websocket", "qmux", "multipath"]
categories = ["network-programming"]

[dependencies]
# No TLS is chosen here: enable a TLS feature of tokio-tungstenite in the
# application for wss:// URLs, or hand over an established stream.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.47", default-features = false, features = ["net", "time", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
zmux = { version = "1.2.0", path = "../.." }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
