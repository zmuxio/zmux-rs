[package]
name = "zmux-rustls"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "TLS 1.3 pipe carriers for zmux over tokio-rustls, with the exporter wired for carrier-bound joins"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["zmux", "tls", "rustls", "multipath"]
categories = ["network-programming"]

[dependencies]
# No crypto provider is chosen here: the application's rustls configuration
# brings its own.
tokio-rustls = { version = "0.26", default-features = false }
tokio = { version = "1.47", default-features = false, features = ["net"] }
zmux = { version = "1.2.0", path = "../.." }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
