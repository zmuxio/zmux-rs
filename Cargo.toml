[package]
name = "zmux"
version = "1.2.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "QMux-compatible multiplexing of streams and datagrams over one or many reliable byte pipes"
repository = "https://github.com/zmuxio/zmux-rs"
readme = "README.md"
keywords = ["multiplexing", "qmux", "quic", "streams", "multipath"]
categories = ["network-programming"]

[workspace]
members = [
    ".",
    "adapter/rustls",
    "adapter/quinn",
    "adapter/http",
    "adapter/websocket",
    "adapter/webtransport",
    "adapter/h3",
    "shaping",
    "seal-proto",
    "seal",
]
# The default gate: the core and the TLS and QUIC adapters; `--workspace`
# builds the other adapters too.
default-members = [".", "adapter/rustls", "adapter/quinn"]
exclude = ["interop/carrier-mem", "interop/peer", "interop/qmux", "interop/qmux-peer"]
resolver = "3"

[features]
default = ["tokio"]
# The tokio driver: `Session`, `SendStream`, `RecvStream` at the crate root.
tokio = ["dep:tokio", "dep:libc", "dep:atomic-waker"]
# The std driver: `zmux::blocking`.
blocking = ["dep:libc"]
# Suite 2 of Join and the ChaCha20-Poly1305 of the secure carrier's records.
seal-chacha = ["dep:chacha20poly1305"]
# Deterministic values for the conformance trace runner (the trace
# profiles' test-mode choices). Never enable this in production builds.
test-hooks = []

[dependencies]
# Suite 1 of Join, always present.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"], optional = true }
# The tokio driver's single-waker slots (a pipe's read waker, a maintainer's stop).
atomic-waker = { version = "1.1", optional = true }
bytes = "1.12"
getrandom = "0.4"
hmac = "0.13"
# The ML-KEM-768 of Group 2 (Join and session epochs) and of the Establish Profiles.
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768", "std"] }
sha2 = "0.11"
tokio = { version = "1.54", optional = true, features = ["rt", "net", "io-util", "sync", "time"] }
# The X25519 of Groups 1 and 2 and of the Establish Profiles.
x25519-dalek = { version = "3", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
# getsockopt(TCP_INFO) and the low-water mark of TCP carriers (src/driver/tcp.rs).
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["full", "test-util"] }
zmux = { path = ".", features = ["test-hooks", "blocking", "seal-chacha"] }
# TLS-over-TCP carrier of the benches only; the library has no TLS dependency.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Model checking of the drivers' synchronization units (src/driver/loom.rs):
# LOOM_MAX_PREEMPTIONS=2 RUSTFLAGS="--cfg loom" CARGO_TARGET_DIR=target/loom \
#     cargo test --lib --release loom
[target.'cfg(loom)'.dev-dependencies]
loom = { version = "0.7.2", features = ["futures"] }

# Randomized schedules of the std driver's thread protocol
# (src/driver/shuttle.rs, the driver's thread-protocol schedule exploration):
# RUSTFLAGS="--cfg shuttle" CARGO_TARGET_DIR=target/shuttle \
#     cargo test --lib --release --features blocking shuttle
[target.'cfg(shuttle)'.dev-dependencies]
shuttle = "0.9.10"

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "mpsched"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(shuttle)'] }

[profile.bench]
debug = 1

# ML-KEM is slow unoptimised; its vectors run thousands of operations.
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.dev.package.libcrux-sha3]
opt-level = 3

[[bench]]
name = "session"
harness = false

[[bench]]
name = "autotune"
harness = false

[[bench]]
name = "seal"
harness = false
